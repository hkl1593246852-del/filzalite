name: FilzaLite
options:
  bundleIdPrefix: com.research
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FilzaLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: vendor/AirCard/AirliftFFI.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.research.filzalite
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.3"
        CURRENT_PROJECT_VERSION: "3"
