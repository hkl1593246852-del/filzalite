name: FilzaLite
options:
  bundleIdPrefix: com.research
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  FilzaLite:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: vendor/AirCard/AirliftFFI.xcframework
        embed: false
        link: true
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FilzaLite
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.research.filzalite
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
