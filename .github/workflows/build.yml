name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AirliftFFI from upstream
        run: |
          git clone --depth 1 https://github.com/Mak5er/AirCard-iOS.git vendor/AirCard
          ls vendor/AirCard/AirliftFFI.xcframework
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Rust + iOS target
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-ios

      - name: Rebuild AirliftFFI with al_exploit_pull
        run: |
          source "$HOME/.cargo/env"
          cat rust-patch/exploit_pull.rs >> vendor/AirCard/rust-core/src/exploit.rs
          cat rust-patch/lib_export.rs  >> vendor/AirCard/rust-core/src/lib.rs
          cd vendor/AirCard/rust-core
          cargo build --release --target aarch64-apple-ios 2>&1 | tail -n 30
          cp target/aarch64-apple-ios/release/libairlift_ffi.a \
             ../../AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a
          ls -lh ../../AirliftFFI.xcframework/ios-arm64/libairlift_ffi.a

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project FilzaLite.xcodeproj -scheme FilzaLite \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | tail -n 80

      - name: Package IPA
        if: success()
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr FilzaLite.ipa Payload
          ls -lh FilzaLite.ipa

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FilzaLite-ipa
          path: FilzaLite.ipa
          if-no-files-found: error
